<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Folio</title><meta name="theme-color" content="#4f46c8"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<main id="lib" class="view">
 <header class="top"><h1>Folio</h1><div class="grow"></div>
  <button class="ib" data-act="theme" aria-label="Toggle dark mode"><svg><use/></svg></button>
  <button class="ib" data-act="settings" aria-label="Sync and settings"><svg><use/></svg></button></header>
 <div class="search"><input id="q" type="search" placeholder="Search your library" aria-label="Search"></div>
 <div class="seg" id="grp"><button data-g="folder" class="on">Folders</button><button data-g="genre">Genres</button></div>
 <div class="chips" id="chips"></div>
 <section id="grid" class="grid"></section>
 <div id="empty" class="empty" hidden><div class="blob"></div><h2>Your shelf is empty</h2><p>Add a PDF, a set of comic pages, or paste a link.</p></div>
 <button class="fab" data-act="import"><svg><use/></svg>Add</button>
</main>
<main id="rd" class="view" hidden>
 <header class="rbar"><button class="ib" data-act="back" aria-label="Back to library"><svg><use/></svg></button><h2 id="rt"></h2><div class="grow"></div>
  <button class="ib" data-act="mark" id="markBtn" aria-label="Bookmark this page"><svg><use/></svg></button>
  <button class="ib" data-act="marks" aria-label="Bookmarks list"><svg><use/></svg></button></header>
 <div id="stage"><div id="zoom"><div id="book"></div></div></div>
 <footer class="rfoot"><span id="pn">1</span><input id="seek" type="range" min="1" value="1" aria-label="Page"><span id="pt">1</span></footer>
</main>
<div id="scrim" hidden></div>
<dialog id="dlg"></dialog><div id="toast" role="status"></div>
<input id="file" type="file" accept="application/pdf,image/*" multiple hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script src="app.js"></script></body></html>
